# Jaeger chart values — dev environment
# Chart: jaegertracing/jaeger (v2 — unified OpenTelemetry-based architecture)
#
# With fullnameOverride=jaeger, the chart creates service: jaeger
#
# K8s endpoints (referenced by other charts):
#   OTLP gRPC:  jaeger:4317
#   Query UI:   jaeger:16686
#
# Prometheus metrics backend points to kube-prometheus-stack release "monitoring".
# userconfig is rendered into a ConfigMap (name: user-config) and mounted at
#   /etc/jaeger/user-config.yaml inside the container.
# healthcheckv2 at 0.0.0.0:13133 is required — livenessProbe/readinessProbe
#   are hardcoded to that port in the chart's deploy template.

fullnameOverride: jaeger

# Note: docker-compose uses jaegertracing/all-in-one:1.54 (Jaeger v1).
# This Helm chart deploys Jaeger v2 (jaegertracing/jaeger) — a different architecture;
# there is no equivalent v1 tag. Chart default version is used.
jaeger:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

  extensions:
    jaeger_storage:
      backends:
        some_storage:
          memory:
            max_traces: 100000
      metric_backends:
        some_metrics_storage:
          prometheus:
            endpoint: http://monitoring-kube-prometheus-prometheus:9090
            normalize_calls: true
            normalize_duration: true

    jaeger_query:
      storage:
        traces: some_storage
        metrics: some_metrics_storage

    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: some_storage
