# Bitnami RabbitMQ chart values — dev environment
# Chart: bitnami/rabbitmq
#
# Secret values injected by pipeline via --set:
#   auth.password  ← Key Vault: rabbitmq-password
#
# With fullnameOverride=rabbitmq, Bitnami creates:
#   Service: rabbitmq:5672   (matches RabbitMQ__HostName in products-secrets)
#   Metrics: rabbitmq:15692  (built-in Prometheus plugin, scraped by Prometheus)

auth:
  username: guest
  # password: injected via pipeline --set

fullnameOverride: rabbitmq

image:
  tag: "4.2"

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: false

# Built-in Prometheus metrics plugin on port 15692.
metrics:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
