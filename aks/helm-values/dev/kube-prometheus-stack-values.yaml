# kube-prometheus-stack chart values — dev environment
# Chart: prometheus-community/kube-prometheus-stack
# Helm release name: monitoring
#
# This release creates the following K8s services (used by other components):
#   Prometheus:    monitoring-kube-prometheus-prometheus:9090
#   Alertmanager:  monitoring-kube-prometheus-alertmanager:9093
#   Grafana:       monitoring-grafana:80
#
# Secret values injected by pipeline via --set:
#   alertmanager.config.receivers[0].slack_configs[0].api_url
#     ← Key Vault: alertmanager-slack-webhook

# ── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    replicas: 1
    image:
      tag: "v3.1.0"
    # Enable OTLP receiver (equivalent to --web.enable-otlp-receiver and
    # --enable-feature=exemplar-storage,otlp-receiver in docker-compose).
    enableFeatures:
      - exemplar-storage
      - otlp-receiver

    additionalArgs:
      - name: web.enable-otlp-receiver
        value: ""

    # Static scrape targets matching the docker-compose prometheus.yml setup.
    # Uses actual K8s service names (Bitnami built-in exporters).
    additionalScrapeConfigs:
      - job_name: rabbitmq
        static_configs:
          - targets:
              - rabbitmq:15692

      - job_name: postgres
        static_configs:
          - targets:
              - postgresql-metrics:9187

      - job_name: redis
        static_configs:
          - targets:
              - redis-metrics:9121

    storageSpec:
      emptyDir:
        medium: Memory

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  # Full alertmanager config; api_url is overridden via --set in the pipeline.
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack-notifications
      group_by: [alertname, queue, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - matchers:
            - severity="critical"
          group_wait: 10s
          repeat_interval: 30m
        - matchers:
            - severity="warning"
          group_wait: 1m
          repeat_interval: 2h

    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url: ""   # overridden via --set in pipeline
            channel: '#alert'
            send_resolved: true
            title: |
              {{ if .CommonAnnotations.summary -}}
                [{{ .Status }}] {{ .CommonAnnotations.summary }}
              {{- else -}}
                [{{ .Status }}] {{ .CommonLabels.alertname }}
              {{- end }}
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              {{ if .CommonLabels.queue }}*Queue:* {{ .CommonLabels.queue }}{{ end }}
              *Description:* {{ .CommonAnnotations.description }}
              {{ range .Alerts }}- *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
              {{ end }}
            color: '{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: [alertname, queue]

  alertmanagerSpec:
    replicas: 1
    image:
      tag: "v0.27.0"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  replicas: 1
  image:
    tag: "10.3.3"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true

  # Prometheus datasource is provisioned automatically by kube-prometheus-stack.
  # Add Loki and Jaeger datasources matching UIDs from configs/grafana/datasource.yml
  # so that existing dashboard cross-links (trace↔log↔metric) continue to work.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      uid: a62b7f46-ea9c-4eba-be9f-5c3d18d1f0f4
      url: http://loki:3100
      editable: true
      jsonData:
        derivedFields:
          - datasourceUid: b4ce00d6-faea-4269-9747-83ab72e1e8de
            matcherRegex: '"trace[iI]d"\s*:\s*"([^"]+)"'
            name: TraceID
            url: '$${__value.raw}'
            internalLinkEnabled: true

    - name: Jaeger
      type: jaeger
      access: proxy
      uid: b4ce00d6-faea-4269-9747-83ab72e1e8de
      url: http://jaeger:16686
      editable: true
      jsonData:
        nodeGraph:
          enabled: true
        tracesToLogsV2:
          datasourceUid: a62b7f46-ea9c-4eba-be9f-5c3d18d1f0f4
          spanStartTimeShift: -10s
          spanEndTimeShift: 10s
          tags:
            - key: service.name
              value: service_name
          filterByTraceId: true
          filterBySpanId: true
          customQuery: true
          query: '{job=~".+"} | json | spanid = "$${__span.spanId}"'

# ── Disable resource-heavy components unused by this stack ────────────────────
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
