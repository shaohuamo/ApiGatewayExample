# Grafana Loki chart values — dev environment
# Chart: grafana/loki
#
# SingleBinary (monolithic) mode — suitable for single-node dev cluster.
# With fullnameOverride=loki, the K8s service is: loki:3100
#
# This matches:
#   - otel-collector exporter: http://loki:3100/loki/api/v1/push
#   - Grafana Loki datasource: http://loki:3100

deploymentMode: SingleBinary

fullnameOverride: loki

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: false

# Disable distributed components (not needed for SingleBinary)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable Memcached dependencies to save resources on single-node cluster
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Disable gateway (direct access via loki:3100)
gateway:
  enabled: false
