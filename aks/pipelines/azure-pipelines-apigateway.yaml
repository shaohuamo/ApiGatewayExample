# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/backend/Gateway/ApiGateway/**

resources:
- repo: self

variables:
  # Reference global variable group for Docker registry and image configuration
  # This group is accessible to Build stage
  - group: apigateway-global

  # Explicit path to the API Gateway Dockerfile
  - dockerfilePath: 'src/backend/Gateway/ApiGateway/Dockerfile'
  - tag: '$(Build.BuildId)'

  # Agent VM image name
  - vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context must be the repo root: the Dockerfile COPYs files using
        # paths relative to the solution root (e.g. src/backend/BuildingBlocks/...)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  variables:
  - group: apigateway-dev

  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Deploy API Gateway to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: $(kubernetesServiceConnectionName)
              namespace: $(kubernetes-namespace)
              manifests: aks/manifests/dev/backend/apigateway-dev.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

