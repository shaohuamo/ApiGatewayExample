# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/backend/Gateway/ApiGateway/**

resources:
- repo: self

variables:
  # Reference global variable group for Docker registry and image configuration
  # This group is accessible to Build stage
  - group: apigateway-global

  # Explicit path to the API Gateway Dockerfile
  - name: dockerfilePath
    value: 'src/backend/Gateway/ApiGateway/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context must be the repo root: the Dockerfile COPYs files using
        # paths relative to the solution root (e.g. src/backend/BuildingBlocks/...)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - pwsh: |
              $source = "aks/manifests/dev/backend/apigateway-dev.yaml"
              $target = "$(Pipeline.Workspace)/apigateway-dev.rendered.yaml"

              (Get-Content $source -Raw) `
                -replace '\$\(tag\)', '$(tag)' `
                -replace '\$\(OCELOT_LIMIT\)', '$(OCELOT_LIMIT)' `
                -replace '\$\(OCELOT_PERIOD\)', '$(OCELOT_PERIOD)' `
                -replace '\$\(APP_WHITELIST_1\)', '$(APP_WHITELIST_1)' |
                Set-Content $target
            displayName: Render API Gateway dev manifest

          - task: KubernetesManifest@1
            displayName: Deploy API Gateway to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: |
                $(Pipeline.Workspace)/apigateway-dev.rendered.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

