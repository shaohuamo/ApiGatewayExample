# Azure Function
# Build a .NET isolated Azure Functions package, then deploy it to a Windows Consumption Azure Function App

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - src/backend/Services/ProductUpdatesReprocessor/**
      - src/backend/BuildingBlocks/CommonService/**

resources:
- repo: self

variables:
  - name: azureSubscription
    value: microservicesdemo-resource-group-connection
  - name: functionAppName
    value: 'microservicesdemo-productupdates-dlq-func'
  - name: buildConfiguration
    value: Release
  - name: functionProjectPath
    value: 'src/backend/Services/ProductUpdatesReprocessor/ProductUpdatesReprocessor.Functions/ProductUpdatesReprocessor.Functions.csproj'
  - name: publishOutputPath
    value: '$(Build.ArtifactStagingDirectory)/publish'
  - name: functionPackagePath
    value: '$(Build.ArtifactStagingDirectory)/product-updates-reprocessor-function.zip'
  - name: functionPackageName
    value: 'product-updates-reprocessor-function'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and package stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 9 SDK
      inputs:
        packageType: sdk
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: Restore Azure Function project
      inputs:
        command: restore
        projects: '$(functionProjectPath)'

    - task: DotNetCoreCLI@2
      displayName: Publish Azure Function project
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(functionProjectPath)'
        arguments: '--configuration $(buildConfiguration) --output $(publishOutputPath)'
        zipAfterPublish: false
        modifyOutputPath: false

    - task: ArchiveFiles@2
      displayName: Archive Azure Function package
      inputs:
        rootFolderOrFile: '$(publishOutputPath)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(functionPackagePath)'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: Publish Azure Function package artifact
      inputs:
        targetPath: '$(functionPackagePath)'
        artifactName: '$(functionPackageName)'

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: DownloadPipelineArtifact@2
            displayName: Download Azure Function package
            inputs:
              buildType: current
              artifactName: '$(functionPackageName)'
              targetPath: '$(Pipeline.Workspace)/$(functionPackageName)'

          - task: AzureFunctionApp@2
            displayName: Deploy Azure Function to dev
            inputs:
              azureSubscription: $(azureSubscription)
              appType: functionApp
              appName: $(functionAppName)
              package: '$(Pipeline.Workspace)/$(functionPackageName)/product-updates-reprocessor-function.zip'
