# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/backend/Services/Products/**
    - src/backend/BuildingBlocks/CommonService/**

resources:
- repo: self

variables:
  # Reference global variable group for Docker registry and image configuration
  # This group is accessible to Build and Test stages
  - group: products-microservice-global
  
  # Explicit path avoids picking up Dockerfiles from other services (Gateway, etc.)
  - name: dockerfilePath
    value: 'src/backend/Services/Products/ProductsMicroService.API/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context must be the repo root: the Dockerfile COPYs files using
        # paths relative to the solution root (e.g. src/backend/BuildingBlocks/...)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Test
  displayName: Run unit tests
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Test
    displayName: Unit Tests
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 9 SDK
      inputs:
        packageType: sdk
        version: '9.x'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      inputs:
        command: test
        projects: 'tests/ProductsServiceUnitTests/ProductsServiceUnitTests.csproj'
        arguments: '--configuration Release --logger trx --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults'
        publishTestResults: false

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Test
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  variables:
  - group: products-microservice-dev

  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Deploy Products microservice to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: $(kubernetesServiceConnectionName)
              namespace: $(kubernetes-namespace)
              manifests: aks/manifests/dev/backend/products-microservice-dev.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

