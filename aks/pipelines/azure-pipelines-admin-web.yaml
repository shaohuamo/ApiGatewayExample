# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/frontend/admin-web/**

resources:
- repo: self

variables:
  # Reference global variable group for Docker registry and image configuration
  # This group is accessible to Build stage
  - group: admin-web-global

  # Path to the admin-web Dockerfile (Next.js build is handled inside the Dockerfile)
  - dockerfilePath: 'src/frontend/admin-web/Dockerfile'
  - tag: '$(Build.BuildId)'

  # Agent VM image name
  - vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context is the admin-web directory where package.json is located
        buildContext: 'src/frontend/admin-web'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  variables:
  - group: admin-web-dev

  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Deploy admin-web to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: $(kubernetesServiceConnectionName)
              namespace: $(kubernetes-namespace)
              manifests: aks/manifests/dev/frontend/admin-web-dev.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

