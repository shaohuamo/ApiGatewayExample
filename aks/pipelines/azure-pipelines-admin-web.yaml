# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/frontend/admin-web/**
    - aks/manifests/dev/frontend/admin-web-dev.yaml
    - aks/pipelines/azure-pipelines-admin-web.yaml

resources:
- repo: self

variables:
  # Reference global variable groups for Docker registry and runtime secrets.
  - group: identityserver-global
  - group: admin-web-global
  - group: admin-web-keyvault
  - group: infrastructure-key-vault
  - group: identityserver-key-vault

  # Path to the admin-web Dockerfile (Next.js build is handled inside the Dockerfile)
  - name: dockerfilePath
    value: 'src/frontend/admin-web/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context is the admin-web directory where package.json is located
        buildContext: 'src/frontend/admin-web'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - pwsh: |
              function ConvertTo-Base64([string]$name, [string]$value) {
                if ([string]::IsNullOrWhiteSpace($value) -or $value.Contains('$(')) {
                  throw "admin-web secret value '$name' is empty or not defined."
                }

                [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($value))
              }

              $target = "$(Pipeline.Workspace)/admin-web-secrets-dev.yaml"
              $secretData = [ordered]@{
                "frontend-public-url" = $env:ADMIN_WEB_FRONTEND_PUBLIC_URL
                "identityserver-public-url" = $env:ADMIN_WEB_IDENTITYSERVER_PUBLIC_URL
                "identityserver-frontend-client-id" = $env:ADMIN_WEB_IDENTITYSERVER_FRONTEND_CLIENT_ID
                "identityserver-frontend-client-secret" = $env:ADMIN_WEB_IDENTITYSERVER_FRONTEND_CLIENT_SECRET
                "auth-secret" = $env:ADMIN_WEB_AUTH_SECRET
                "postgres-host" = "postgres"
                "postgres-user" = "postgres"
                "postgres-password" = $env:ADMIN_WEB_POSTGRES_PASSWORD
                "auth-redis-url" = "redis://redis:6379"
              }

              $lines = @(
                "apiVersion: v1"
                "kind: Secret"
                "metadata:"
                "  name: admin-web-secrets"
                "  namespace: dev"
                "type: Opaque"
                "data:"
              )

              foreach ($item in $secretData.GetEnumerator()) {
                $lines += "  $($item.Key): $(ConvertTo-Base64 $item.Key $item.Value)"
              }

              Set-Content -Path $target -Value ($lines -join [Environment]::NewLine)
            displayName: Render admin-web secrets manifest for dev namespace
            env:
              ADMIN_WEB_FRONTEND_PUBLIC_URL: $(FRONTEND_PUBLIC_URL)
              ADMIN_WEB_IDENTITYSERVER_PUBLIC_URL: $(IDENTITYSERVER_PUBLIC_URL)
              ADMIN_WEB_IDENTITYSERVER_FRONTEND_CLIENT_ID: $(IDENTITYSERVER_FRONTEND_CLIENT_ID)
              ADMIN_WEB_IDENTITYSERVER_FRONTEND_CLIENT_SECRET: $(identityserver-frontend-client-secret)
              ADMIN_WEB_AUTH_SECRET: $(auth-secret)
              ADMIN_WEB_POSTGRES_PASSWORD: $(postgres-password)

          - task: KubernetesManifest@1
            displayName: Apply admin-web secrets in dev namespace
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: |
                $(Pipeline.Workspace)/admin-web-secrets-dev.yaml

          - pwsh: |
              $source = "aks/manifests/dev/frontend/admin-web-dev.yaml"
              $target = "$(Pipeline.Workspace)/admin-web-dev.rendered.yaml"

              (Get-Content $source -Raw) `
                -replace '\$\(tag\)', '$(tag)' |
                Set-Content $target
            displayName: Render admin-web dev manifest

          - task: KubernetesManifest@1
            displayName: Deploy admin-web to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: $(Pipeline.Workspace)/admin-web-dev.rendered.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

