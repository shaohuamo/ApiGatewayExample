# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/frontend/admin-web/**
    - aks/manifests/dev/frontend/admin-web-dev.yaml
    - aks/pipelines/azure-pipelines-admin-web.yaml

resources:
- repo: self

variables:
  # Reference global variable groups for Docker registry and runtime secrets.
  - group: identityserver-global
  - group: admin-web-global
  - group: admin-web-keyvault
  - group: infrastructure-key-vault
  - group: identityserver-key-vault

  # Path to the admin-web Dockerfile (Next.js build is handled inside the Dockerfile)
  - name: dockerfilePath
    value: 'src/frontend/admin-web/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context is the admin-web directory where package.json is located
        buildContext: 'src/frontend/admin-web'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Create admin-web secrets in dev namespace
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              secretType: generic
              secretName: admin-web-secrets
              forceUpdate: true
              secretArguments: |
                --from-literal=frontend-public-url=$(FRONTEND_PUBLIC_URL)
                --from-literal=identityserver-public-url=$(IDENTITYSERVER_PUBLIC_URL)
                --from-literal=identityserver-frontend-client-id=$(IDENTITYSERVER_FRONTEND_CLIENT_ID)
                --from-literal=identityserver-frontend-client-secret=$(IDENTITYSERVER_FRONTEND_CLIENT_SECRET)
                --from-literal=auth-secret=$(auth-secret)
                --from-literal=postgres-host=postgres
                --from-literal=postgres-user=postgres
                --from-literal=postgres-password=$(postgres-password)
                --from-literal=auth-redis-url=redis://redis:6379

          - pwsh: |
              $source = "aks/manifests/dev/frontend/admin-web-dev.yaml"
              $target = "$(Pipeline.Workspace)/admin-web-dev.rendered.yaml"

              (Get-Content $source -Raw) `
                -replace '\$\(tag\)', '$(tag)' |
                Set-Content $target
            displayName: Render admin-web dev manifest

          - task: KubernetesManifest@1
            displayName: Deploy admin-web to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: $(Pipeline.Workspace)/admin-web-dev.rendered.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

