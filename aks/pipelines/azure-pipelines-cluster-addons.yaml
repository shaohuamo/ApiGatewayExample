# Cluster add-ons pipeline
# Enables the AKS application routing add-on and verifies the managed NGINX controller.

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - aks/manifests/shared/cert-manager/clusterissuer-letsencrypt-staging.yaml
      - aks/manifests/shared/cert-manager/clusterissuer-letsencrypt-prod.yaml
      - aks/pipelines/azure-pipelines-cluster-addons.yaml

resources:
  - repo: self

variables:
  - name: vmImageName
    value: ubuntu-latest
  - name: azureSubscription
    value: microservicesdemo-resource-group-connection
  - name: aksResourceGroup
    value: microservicesdemo-resource-group
  - name: aksClusterName
    value: microservicesdemo-aks-cluster

stages:
  - stage: EnableApplicationRouting
    displayName: Enable AKS Application Routing
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/dev')
    jobs:
      - deployment: EnableApplicationRouting
        displayName: Enable managed NGINX ingress add-on on AKS
        pool:
          vmImage: $(vmImageName)
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout source code

                - task: AzureCLI@2
                  displayName: Enable application routing add-on
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      APP_ROUTING_ENABLED=$(az aks show \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --query "ingressProfile.webAppRouting.enabled" \
                        --output tsv 2>/dev/null || true)

                      if [ -z "$APP_ROUTING_ENABLED" ] || [ "$APP_ROUTING_ENABLED" = "null" ]; then
                        APP_ROUTING_ENABLED=$(az aks show \
                          --resource-group $(aksResourceGroup) \
                          --name $(aksClusterName) \
                          --query "addonProfiles.applicationRouting.enabled" \
                          --output tsv 2>/dev/null || true)
                      fi

                      if [ "$APP_ROUTING_ENABLED" != "true" ]; then
                        ENABLE_OUTPUT=$(az aks approuting enable \
                          --resource-group $(aksResourceGroup) \
                          --name $(aksClusterName) 2>&1) || {
                            if echo "$ENABLE_OUTPUT" | grep -qi "already enabled"; then
                              echo "App Routing already enabled; continuing."
                              echo "$ENABLE_OUTPUT"
                            else
                              echo "$ENABLE_OUTPUT"
                              exit 1
                            fi
                          }

                        if [ -n "${ENABLE_OUTPUT:-}" ]; then
                          echo "$ENABLE_OUTPUT"
                        fi
                      fi

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --admin \
                        --overwrite-existing

                      kubectl patch nginxingresscontroller default \
                        --type merge \
                        -p '{"spec":{"scaling":{"minReplicas":1,"maxReplicas":2,"threshold":"balanced"}}}'

                      ADMISSION_SERVICE_EXISTS=$(kubectl get service ingress-nginx-controller-admission \
                        --namespace ingress-nginx \
                        --ignore-not-found 2>/dev/null || true)

                      if [ -z "$ADMISSION_SERVICE_EXISTS" ]; then
                        STALE_WEBHOOKS=$(kubectl get validatingwebhookconfiguration \
                          -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{range .webhooks[*]}{.clientConfig.service.namespace}{"/"}{.clientConfig.service.name}{" "}{end}{"\n"}{end}' |
                          awk -F'|' '$2 ~ /ingress-nginx\/ingress-nginx-controller-admission/ { print $1 }')

                        if [ -n "$STALE_WEBHOOKS" ]; then
                          while IFS= read -r webhook; do
                            kubectl delete validatingwebhookconfiguration "$webhook"
                          done <<< "$STALE_WEBHOOKS"
                        fi
                      fi

                      kubectl apply \
                        -f aks/manifests/shared/cert-manager/clusterissuer-letsencrypt-staging.yaml \
                        -f aks/manifests/shared/cert-manager/clusterissuer-letsencrypt-prod.yaml

                      kubectl get ingressclass webapprouting.kubernetes.azure.com
                      kubectl get service \
                        --namespace app-routing-system \
                        nginx
