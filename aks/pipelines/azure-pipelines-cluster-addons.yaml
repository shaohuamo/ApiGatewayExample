# Cluster add-ons pipeline
# Enables the AKS application routing add-on and verifies the managed NGINX controller.

trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - aks/pipelines/azure-pipelines-cluster-addons.yaml

resources:
  - repo: self

variables:
  - name: vmImageName
    value: ubuntu-latest
  - name: azureSubscription
    value: microservicesdemo-resource-group-connection
  - name: aksResourceGroup
    value: microservicesdemo-resource-group
  - name: aksClusterName
    value: microservicesdemo-aks-cluster

stages:
  - stage: EnableApplicationRouting
    displayName: Enable AKS Application Routing
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/dev')
    jobs:
      - deployment: EnableApplicationRouting
        displayName: Enable managed NGINX ingress add-on on AKS
        pool:
          vmImage: $(vmImageName)
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: AzureCLI@2
                  displayName: Enable application routing add-on
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      APP_ROUTING_ENABLED=$(az aks show \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --query "addonProfiles.applicationRouting.enabled" \
                        --output tsv)

                      if [ "$APP_ROUTING_ENABLED" != "true" ]; then
                        az aks approuting enable \
                          --resource-group $(aksResourceGroup) \
                          --name $(aksClusterName)
                      fi

                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --admin \
                        --overwrite-existing

                      kubectl patch nginxingresscontroller default \
                        --type merge \
                        -p '{"spec":{"scaling":{"minReplicas":1,"maxReplicas":2,"threshold":"balanced"}}}'

                      kubectl get ingressclass webapprouting.kubernetes.azure.com
                      kubectl get service \
                        --namespace app-routing-system \
                        nginx