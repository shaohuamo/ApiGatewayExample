# Docker
# Build and push an image to Azure Container Registry, then deploy to AKS
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - prod
  paths:
    include:
    - src/backend/Services/Test/**
    - src/backend/BuildingBlocks/CommonService/**
    - aks/manifests/dev/backend/test-microservice-dev.yaml
    - aks/pipelines/azure-pipelines-test-microservice.yaml

resources:
- repo: self

variables:
  # Reference global variable groups for Docker registry and runtime secrets.
  - group: test-microservice-global
  - group: infrastructure-key-vault

  # Explicit path avoids picking up Dockerfiles from other services (Gateway, etc.)
  - name: dockerfilePath
    value: 'src/backend/Services/Test/TestMicroservice.API/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

  # Agent VM image name
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        # Build context must be the repo root: the Dockerfile COPYs files using
        # paths relative to the solution root (e.g. src/backend/BuildingBlocks/...)
        buildContext: $(Build.SourcesDirectory)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - pwsh: |
              function ConvertTo-Base64([string]$name, [string]$value) {
                if ([string]::IsNullOrWhiteSpace($value)) {
                  throw "Test microservice secret value '$name' is empty."
                }

                [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($value))
              }

              $target = "$(Pipeline.Workspace)/test-microservice-secrets-dev.yaml"
              $secretData = [ordered]@{
                "rabbitmq-host" = "rabbitmq"
                "rabbitmq-user" = "guest"
                "rabbitmq-password" = $env:TEST_RABBITMQ_PASSWORD
                "servicebus-connection-string" = $env:TEST_SERVICEBUS_CONNECTION_STRING
              }

              $lines = @(
                "apiVersion: v1"
                "kind: Secret"
                "metadata:"
                "  name: test-microservice-secrets"
                "  namespace: dev"
                "type: Opaque"
                "data:"
              )

              foreach ($item in $secretData.GetEnumerator()) {
                $lines += "  $($item.Key): $(ConvertTo-Base64 $item.Key $item.Value)"
              }

              Set-Content -Path $target -Value ($lines -join [Environment]::NewLine)
            displayName: Render Test microservice secrets manifest for dev namespace
            env:
              TEST_RABBITMQ_PASSWORD: $(rabbitmq-password)
              TEST_SERVICEBUS_CONNECTION_STRING: $(servicebus-connection-string)

          - task: KubernetesManifest@1
            displayName: Apply Test microservice secrets in dev namespace
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: |
                $(Pipeline.Workspace)/test-microservice-secrets-dev.yaml

          - task: KubernetesManifest@1
            displayName: Deploy Test microservice to dev namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: dev-microservicesdemo-aks-cluster-dev-1778160743494
              namespace: dev
              manifests: aks/manifests/dev/backend/test-microservice-dev.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

- stage: DeployToQA
  displayName: Deploy to QA
  dependsOn: Build
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/qa'))
  jobs:
  - deployment: DeploymentToQA
    displayName: Deployment to QA Environment
    pool:
      vmImage: $(vmImageName)
    environment: qa
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout source code

          - task: KubernetesManifest@1
            displayName: Create Test microservice secrets in qa namespace
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
              namespace: qa
              secretType: generic
              secretName: test-microservice-secrets
              forceUpdate: true
              secretArguments: |
                --from-literal=rabbitmq-host=rabbitmq
                --from-literal=rabbitmq-user=guest
                --from-literal=rabbitmq-password=$(rabbitmq-password)
                --from-literal=servicebus-connection-string=$(servicebus-connection-string)

          - task: KubernetesManifest@1
            displayName: Deploy Test microservice to qa namespace in kubernetes
            inputs:
              action: deploy
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: qa-microservicesdemo-aks-cluster-qa-1778160953610
              namespace: qa
              manifests: aks/manifests/qa/backend/test-microservice-qa.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

