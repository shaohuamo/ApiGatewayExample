apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-microservice-deployment
  labels:
    app: test-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-microservice
  template:
    metadata:
      labels:
        app: test-microservice
    spec:
      containers:
      - name: test-microservice
        image: microservicesdemoregistry.azurecr.io/test-microservice:$(tag)
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: UAT
        - name: App_Name
          value: App_A
        - name: RabbitMQ__HostName
          valueFrom:
            secretKeyRef:
              name: test-microservice-secrets
              key: rabbitmq-host
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: test-microservice-secrets
              key: rabbitmq-user
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: test-microservice-secrets
              key: rabbitmq-password
        - name: RabbitMQ__Port
          value: "5672"
        - name: RabbitMQ__MaxRetryAttempts
          value: "10"
        - name: RabbitMQ__InitialDelaySeconds
          value: "2"
        - name: RabbitMQ__MaxDelaySeconds
          value: "30"
        - name: RabbitMQ__NetworkRecoveryIntervalSeconds
          value: "10"
        - name: RabbitMQ_Products_Exchange
          value: "products.exchange"
        - name: RabbitMQ_Products_RoutingKey
          value: "products.add"
        - name: RabbitMQ_Products_Queue
          value: "products.add.queue"
        - name: ServiceBus__ConnectionString
          valueFrom:
            secretKeyRef:
              name: test-microservice-secrets
              key: servicebus-connection-string
        - name: ServiceBus__ProductsUpdatesTopic
          value: "products.updates"
        - name: ServiceBus__ProductsUpdatesSubscription
          value: "products.updates.test"
        - name: ServiceBus__ProductsUpdatesReprocessTopic
          value: "products.updates.Reprocess"
        - name: Redis__ConnectionString
          value: "redis:6379"
        - name: Redis__InstanceName
          value: "TestMicroservice_"
        - name: MessageIdempotency__KeyPrefix
          value: "processed-message"
        - name: MessageIdempotency__ProcessedMessageTtlMinutes
          value: "1440"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=test.api,deployment.environment=uat"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: test-microservice-service
  labels:
    app: test-microservice
spec:
  selector:
    app: test-microservice
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
