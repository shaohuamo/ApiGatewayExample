apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-dev
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apigateway.dev.example.com
        - admin.dev.example.com
      secretName: microservices-tls
  rules:
    # API Gateway - entry point for all backend API traffic
    - host: apigateway.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigateway-service
                port:
                  number: 8080

    # Admin Web - frontend application
    - host: admin.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-web-service
                port:
                  number: 3000

    # NOTE: products-microservice and test-microservice are intentionally NOT exposed
    # externally. All backend API traffic must go through the API Gateway.
