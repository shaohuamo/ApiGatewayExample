apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: microservicesdemoregistry.azurecr.io/apigateway:$(tag)
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=apigateway,deployment.environment=prod"
        - name: Routes__0__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__0__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__0__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        - name: Routes__1__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__1__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__1__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        - name: Routes__2__RateLimitOptions__Limit
          value: "$(OCELOT_LIMIT)"
        - name: Routes__2__RateLimitOptions__Period
          value: "$(OCELOT_PERIOD)"
        - name: Routes__2__RateLimitOptions__ClientWhitelist__0
          value: "$(APP_WHITELIST_1)"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  labels:
    app: apigateway
spec:
  selector:
    app: apigateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
